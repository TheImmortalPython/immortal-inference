name: "CLA Assistant"

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  CLAAssistant:
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant Check"
        if: ${{ github.event_name == 'pull_request_target' }}
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          empty-commit-for-cla-signed: true
          path-to-document: 'https://github.com/TheImmortalPython/immortal-inference/blob/main/CONTRIBUTING.md'
          branch: 'main'
          allowlist: 'TheImmortalPython,dependabot[bot],renovate[bot],github-actions[bot]'

      - name: "CLA Assistant Comment Response"
        if: ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request }}
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: 'signatures/cla.json'
          empty-commit-for-cla-signed: true
          path-to-document: 'https://github.com/TheImmortalPython/immortal-inference/blob/main/CONTRIBUTING.md'
          branch: 'main'
          allowlist: 'TheImmortalPython,dependabot[bot],renovate[bot],github-actions[bot]'
